# CodeRabbit Configuration for Safeguard Inc.
# https://coderabbit.ai
version: "2"
language: "en-US"
tone_instructions: "Focus on Soroban smart contract security, WASM instruction optimization, authorization checks, and deterministic policy evaluation."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  tools:
    clippy:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true

chat:
  auto_reply: true
